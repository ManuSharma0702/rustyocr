apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-upload-service
  labels:
    app: file-upload-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: file-upload-service

  template:
    metadata:
      labels:
        app: file-upload-service

    spec:
      containers:
        - name: file-upload-service
          image: ghcr.io/manusharma0702/rustyocr-file-upload-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
