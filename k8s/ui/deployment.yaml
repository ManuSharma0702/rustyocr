apiVersion: apps/v1
kind: Deployment

metadata:
  name: ui
  labels:
    app: ui

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ui

  template:
    metadata:
      labels:
        app: ui

    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
        - name: ui
          image: ghcr.io/manusharma0702/rustyocr-ui:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: creds

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
