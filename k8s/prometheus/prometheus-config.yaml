apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
      - job_name: 'job-queue'
        metrics_path: '/metrics'
        static_configs:
          - targets: ['job-queue:8080']

